name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    # Nightly full cross-browser run
    - cron: '0 2 * * *'
  workflow_dispatch:
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      # Pull requests run Chromium only for fast feedback; other events run all projects
      PW_PROJECT_ARGS: ${{ github.event_name == 'pull_request' && '--project=chromium' || '' }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: npm
    - name: Install dependencies
      run: npm ci
    - name: Get Playwright version
      id: pw-version
      run: echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
    - name: Cache Playwright browsers
      id: pw-cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.pw-version.outputs.version }}
    - name: Install Playwright Browsers
      if: steps.pw-cache.outputs.cache-hit != 'true'
      run: npx playwright install --with-deps
    - name: Install Playwright system dependencies
      if: steps.pw-cache.outputs.cache-hit == 'true'
      run: npx playwright install-deps
    - name: Run Playwright tests
      run: npx playwright test $PW_PROJECT_ARGS
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
    - uses: actions/upload-artifact@v4
      if: ${{ failure() }}
      with:
        name: test-results
        path: test-results/
        retention-days: 7
